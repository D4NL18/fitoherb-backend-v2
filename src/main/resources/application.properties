spring.application.name=fitoherb-backend-v2
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/fitoherb-v2
spring.datasource.username=${PostgresUsername:}
spring.datasource.password=${PostgresPassword:}

api.security.token.secret=${JWT_SECRET:default-secret-do-not-use-in-prod}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=${SPRING_MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${mailSenderUsername:}
spring.mail.password=${mailSenderPassword:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB

local.storage.path=${LOCAL_STORAGE_PATH:./temp_images}

# GCP bucket e Supabase ficarao no application-prod.properties
# gcp.bucket.name=fitoherb-images-bucket

spring.jackson.date-format=dd-MM-yyyy
spring.jackson.time-zone=GMT-3

springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.docExpansion=none
fitoherb.ai.service.url=${FITOHERB_AI_URL:http://localhost:8000}

# ERP Atrio (SQL Server 2008 R2 read-only) & Cache RAM
app.erp.sqlserver.host=${ERP_SQLSERVER_HOST:}
app.erp.sqlserver.port=${ERP_SQLSERVER_PORT:1433}
app.erp.sqlserver.database=${ERP_SQLSERVER_DATABASE:FITOHERB}
app.erp.sqlserver.username=${ERP_SQLSERVER_USERNAME:}
app.erp.sqlserver.password=${ERP_SQLSERVER_PASSWORD:}
app.erp.cache.ttl-seconds=${ERP_CACHE_TTL_SECONDS:900}

# Sincronizacao diaria ERP -> Site & Curadoria (Onda 4)
app.erp.sync.cron=${ERP_SYNC_CRON:0 0 8 * * *}
app.erp.sync.internal-scheduler-enabled=${ERP_SYNC_INTERNAL_ENABLED:true}
app.erp.sync.scheduler-token=${SYNC_SCHEDULER_TOKEN:}
app.erp.sync.fallback-category-slug=${ERP_SYNC_FALLBACK_CATEGORY:outros}
app.erp.sync.fallback-supplier-slug=${ERP_SYNC_FALLBACK_SUPPLIER:fitoherb}
app.erp.sync.report-email=${ERP_SYNC_REPORT_EMAIL:}
app.ai.internal-refresh-token=${INTERNAL_REFRESH_TOKEN:}
