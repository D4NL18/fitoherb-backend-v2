name: PR Checks (Quality Gate)

on:
  pull_request:
    branches:
      - develop
      - qa
      - master

jobs:
  validate-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Ativa o cache nativo e seguro das dependências do Gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
        # Passo de segurança crucial: verifica se o gradlew não foi adulterado
        # prevenindo execução de scripts maliciosos injetados no wrapper do repositório.

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve Dependencies
        run: ./gradlew dependencies --no-daemon
        # Baixa as dependências de forma segregada antes dos testes

      - name: Run Unit Tests (Quality Gate)
        run: ./gradlew test --no-daemon
        # Executa a suíte de testes. Se qualquer teste falhar, o exit code quebra a pipeline
        # impedindo o merge do PR nas branches base.
