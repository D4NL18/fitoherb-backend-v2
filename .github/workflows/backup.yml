name: Export Supabase Database Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Executar pg_dump via Docker
        env:
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_URL: ${{ secrets.PROD_DB_URL }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
        run: |
          URL_NO_PREFIX="${DB_URL#jdbc:postgresql://}"
          HOST_PORT="${URL_NO_PREFIX%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT#*:}"
          if [ "$PORT" = "$HOST_PORT" ] || [ -z "$PORT" ] || [ "$PORT" = "6543" ]; then
            PORT="5432"
          fi
          DB_PART="${URL_NO_PREFIX#*/}"
          DB_NAME="${DB_PART%%\?*}"
          DB_NAME="${DB_NAME:-postgres}"

          echo "Exportando backup do host configurado para o banco: $DB_NAME"
          docker run --rm -e PGPASSWORD="${PGPASSWORD}" postgres:17 pg_dump -h "$HOST" -p "$PORT" -U "$DB_USERNAME" -d "$DB_NAME" --clean --if-exists --inserts > fitoherb_backup.sql

      - name: Disponibilizar arquivo de backup para Download
        uses: actions/upload-artifact@v4
        with:
          name: fitoherb_backup
          path: fitoherb_backup.sql
          retention-days: 1
